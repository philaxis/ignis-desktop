<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ignis Desktop</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font: 14px/1.45 system-ui, "Segoe UI", sans-serif; background: Canvas; color: CanvasText;
    }
    main { max-width: 460px; padding: 28px 32px; text-align: center; }
    h1 { margin: 0 0 6px; font-size: 18px; }
    p { margin: 6px 0; opacity: .75; }
    #host { font-weight: 600; opacity: 1; word-break: break-all; }
    button {
      margin-top: 14px; padding: 7px 16px; font: inherit; font-weight: 600; border: 0;
      border-radius: 6px; background: #f27a24; color: #fff; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="status">Connecting…</h1>
    <p id="host"></p>
    <p id="hint"></p>
    <button id="retry" hidden>Try again now</button>
  </main>
  <script>
    // Shown while the Ignis server does not answer. Once it does, the window
    // moves on to the server. A window therefore never stays blank without
    // controls when the server is down.
    const RETRY_MS = 3000;
    const TIMEOUT_MS = 8000;

    const params = new URLSearchParams(location.search);
    let target;
    try {
      target = new URL(params.get('target'));
      if (target.protocol !== 'http:' && target.protocol !== 'https:') throw new Error('scheme');
    } catch {
      target = null;
    }

    const status = document.getElementById('status');
    const host = document.getElementById('host');
    const hint = document.getElementById('hint');
    const retry = document.getElementById('retry');

    // Asks for the favicon rather than the page, so the probe does not look
    // like a page load to the server.
    const probeUrl = () => new URL('favicon.ico', target);

    async function reachable() {
      const abort = new AbortController();
      const timer = setTimeout(() => abort.abort(), TIMEOUT_MS);
      try {
        // An opaque response is enough: any answer means the server is there.
        await fetch(probeUrl(), { mode: 'no-cors', cache: 'no-store', credentials: 'omit', signal: abort.signal });
        return true;
      } catch {
        return false;
      } finally {
        clearTimeout(timer);
      }
    }

    let timer = 0;
    async function attempt() {
      clearTimeout(timer);
      retry.hidden = true;
      if (await reachable()) {
        location.replace(target.href);
        return;
      }
      status.textContent = 'Cannot reach the server';
      hint.textContent = 'Trying again every few seconds. Use the tray menu to change the server address.';
      retry.hidden = false;
      timer = setTimeout(attempt, RETRY_MS);
    }

    if (target) {
      host.textContent = target.host;
      retry.addEventListener('click', attempt);
      attempt();
    } else {
      status.textContent = 'No server address';
      hint.textContent = 'Use the tray menu to set the server address.';
    }
  </script>
</body>
</html>
