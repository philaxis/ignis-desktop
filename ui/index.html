<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ignis Desktop</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 28px 32px; font: 14px/1.45 system-ui, "Segoe UI", sans-serif;
      background: Canvas; color: CanvasText;
    }
    h1 { margin: 0 0 4px; font-size: 20px; }
    p.lead { margin: 0 0 20px; opacity: .7; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input {
      width: 100%; padding: 8px 10px; font: inherit; border-radius: 6px;
      border: 1px solid color-mix(in srgb, CanvasText 30%, transparent);
      background: Field; color: FieldText;
    }
    input:focus { outline: 2px solid #f27a24; outline-offset: 0; border-color: transparent; }
    small { display: block; margin-top: 4px; opacity: .65; }
    button {
      margin-top: 22px; padding: 8px 18px; font: inherit; font-weight: 600; border: 0;
      border-radius: 6px; background: #f27a24; color: #fff; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    #error { margin-top: 14px; color: #d33; min-height: 1.4em; }
  </style>
</head>
<body>
  <h1>Ignis Desktop</h1>
  <p class="lead">Connect to your self-hosted Ignis server.</p>
  <form id="form">
    <label for="server">Server address</label>
    <input id="server" name="server" placeholder="https://ignis.example.ts.net" autocomplete="off" spellcheck="false" autofocus>
    <label for="vault">Vault <span style="font-weight:400;opacity:.65">(optional)</span></label>
    <input id="vault" name="vault" placeholder="vault" autocomplete="off" spellcheck="false">
    <small>Leave empty to pick a vault inside Ignis.</small>
    <button id="save" type="submit">Save and open</button>
    <div id="error" role="alert"></div>
  </form>
  <script>
    const invoke = window.__TAURI_INTERNALS__.invoke;
    const form = document.getElementById('form');
    const server = document.getElementById('server');
    const vault = document.getElementById('vault');
    const save = document.getElementById('save');
    const error = document.getElementById('error');

    invoke('get_settings').then((settings) => {
      server.value = settings.serverUrl;
      vault.value = settings.vault;
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.textContent = '';
      save.disabled = true;
      try {
        await invoke('save_settings', { serverUrl: server.value, vault: vault.value });
      } catch (message) {
        error.textContent = String(message);
        save.disabled = false;
      }
    });
  </script>
</body>
</html>
