name: Release

# Pushing a tag like v0.1.0 builds the Windows installers and attaches them to
# a draft GitHub Release. Pull requests that touch the app build the installers
# too, as a build artifact only, so a broken release build shows up early. You
# can also run the workflow by hand.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "src-tauri/**"
      - "ui/**"
      - "package*.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles msi,nsis
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Ignis Desktop ${{ github.ref_name }}
          releaseBody: Windows installers (.msi and .exe). See the README for setup.
          releaseDraft: true
      - uses: actions/upload-artifact@v4
        with:
          name: ignis-desktop-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
